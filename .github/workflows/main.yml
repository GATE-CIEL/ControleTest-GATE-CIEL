name: C++ GoogleTest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: "3.x"

    - name: Install dependencies
      run: sudo apt-get install -y g++ cmake
      
    - name: Configure project
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build project
      run: cmake --build build

    - name: Run tests
      run: |
        cd build/tests
        ctest --output-on-failure
